<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flashcards</title>
    <style>
      :root {
        color-scheme: light dark;
        --color-background: #f7f8fc;
        --color-surface: #fff;
        --color-text: #202536;
        --color-muted: #687087;
        --color-border: #e2e5ee;
        --color-accent: #5356d8;
        --space-1: 0.5rem;
        --space-2: 1rem;
        --space-3: 1.5rem;
        --radius-card: 0.75rem;
        --shadow-card: 0 0.25rem 1rem rgb(32 37 54 / 8%);
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        display: grid;
        grid-template:
          "header header" auto
          "sidebar main" minmax(0, 1fr)
          "footer footer" auto
          / 16rem minmax(0, 1fr);
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        color: var(--color-text);
        background: var(--color-background);
      }

      header,
      aside,
      main,
      footer {
        padding: var(--space-2);
      }

      header {
        grid-area: header;
        background: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
      }

      aside {
        grid-area: sidebar;
        background: var(--color-surface);
        border-right: 1px solid var(--color-border);
      }

      main {
        grid-area: main;
        min-width: 0;
      }

      footer {
        grid-area: footer;
        color: var(--color-muted);
        background: var(--color-surface);
        border-top: 1px solid var(--color-border);
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      a {
        color: var(--color-accent);
      }

      button {
        font: inherit;
        cursor: pointer;
      }

      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      [tabindex="-1"]:focus-visible {
        outline: 3px solid var(--color-accent);
        outline-offset: 3px;
      }

      dialog {
        width: min(32rem, calc(100% - 2rem));
        padding: var(--space-3);
        color: var(--color-text);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
      }

      dialog::backdrop {
        background: rgb(0 0 0 / 55%);
      }

      dialog form {
        display: grid;
        gap: var(--space-2);
      }

      dialog input {
        width: 100%;
        padding: var(--space-1);
        color: inherit;
        background: var(--color-background);
        border: 1px solid var(--color-border);
        border-radius: 0.25rem;
        font: inherit;
      }

      input {
        font: inherit;
      }

      dialog label {
        font-weight: 600;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--space-1);
      }

      #deck-list,
      #card-list {
        display: grid;
        gap: var(--space-2);
        padding: 0;
        list-style: none;
      }

      .search-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: var(--space-1);
        margin-bottom: var(--space-2);
      }

      .search-field {
        display: grid;
        flex: 1 1 14rem;
        gap: 0.25rem;
      }

      .search-field input {
        min-width: 0;
        padding: var(--space-1);
        color: inherit;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 0.25rem;
      }

      .match-count {
        margin: 0 0 var(--space-2);
        color: var(--color-muted);
      }

      .deck-row,
      .card-item {
        display: grid;
        gap: var(--space-1);
        perspective: 1000px;
      }

      .deck-row {
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
      }

      .deck-select {
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .deck-select[aria-pressed="true"] {
        color: var(--color-accent);
        font-weight: 700;
      }

      .card {
        position: relative;
        min-height: 14rem;
        max-width: 42rem;
        padding: var(--space-3);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-card);
        transform-style: preserve-3d;
        transition: transform 500ms ease;
      }

      .card.is-flipped {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: var(--space-3);
        display: grid;
        align-content: center;
        backface-visibility: hidden;
        overflow-wrap: anywhere;
      }

      .card-back {
        transform: rotateY(180deg);
      }

      .card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-1);
      }

      .card-toolbar,
      .study-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--space-1);
        margin-bottom: var(--space-2);
      }

      .study-panel {
        max-width: 44rem;
      }

      .study-panel .card {
        width: 100%;
        margin-bottom: var(--space-2);
      }

      .study-status {
        color: var(--color-muted);
      }

      .empty-state {
        display: grid;
        justify-items: start;
        gap: var(--space-1);
        max-width: 42rem;
        padding: var(--space-3);
        color: var(--color-muted);
        background: var(--color-surface);
        border: 1px dashed var(--color-border);
        border-radius: var(--radius-card);
      }

      .empty-state h3,
      .empty-state p {
        margin: 0;
      }

      .empty-state-icon {
        width: 2rem;
        height: 2rem;
        color: var(--color-accent);
      }

      .study-card-front-label,
      .study-card-back-label {
        display: block;
        margin-bottom: var(--space-1);
        color: var(--color-muted);
        font-size: 0.875rem;
        font-weight: 600;
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
      }

      @media (max-width: 600px) {
        body {
          grid-template:
            "header" auto
            "sidebar" auto
            "main" minmax(0, 1fr)
            "footer" auto
            / 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--color-border);
        }

        main {
          padding: var(--space-2);
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-background: #151821;
          --color-surface: #202431;
          --color-text: #f1f3fa;
          --color-muted: #b0b7c9;
          --color-border: #383e4f;
          --color-accent: #a6a8ff;
          --shadow-card: 0 0.25rem 1rem rgb(0 0 0 / 24%);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Flashcards</h1>
    </header>

    <aside aria-labelledby="decks-heading">
      <h2 id="decks-heading">Decks</h2>
      <ul id="deck-list" aria-label="Flashcard decks"></ul>
      <button type="button" id="open-deck-modal">Add a deck</button>
    </aside>

    <main id="cards">
      <h2 id="selected-deck-title" tabindex="-1">Cards</h2>
      <div class="card-toolbar">
        <button type="button" id="start-study" disabled>Study deck</button>
        <button type="button" id="open-card-modal" disabled>Add a card</button>
      </div>
      <div class="search-controls" id="search-controls">
        <label class="search-field" for="card-search">
          Search cards
          <input
            id="card-search"
            type="search"
            autocomplete="off"
            aria-controls="card-list"
            aria-describedby="match-count"
          >
        </label>
        <button type="button" id="clear-search">Clear search</button>
      </div>
      <p id="match-count" class="match-count" aria-live="polite" aria-atomic="true"></p>
      <p id="storage-status" role="status" aria-live="polite" hidden></p>
      <ul id="card-list" aria-label="Flashcards"></ul>
      <section id="study-mode" class="study-panel" aria-label="Study session" hidden>
        <p id="study-status" class="study-status" aria-live="polite" aria-atomic="true"></p>
        <article id="study-card" class="card" tabindex="0" aria-label="Flashcard">
          <div class="card-face card-front">
            <span class="study-card-front-label">Question</span>
            <span id="study-front"></span>
          </div>
          <div class="card-face card-back" aria-hidden="true">
            <span class="study-card-back-label">Answer</span>
            <span id="study-back"></span>
          </div>
        </article>
        <div class="study-controls">
          <button type="button" id="study-previous">Previous</button>
          <button type="button" id="study-flip" aria-pressed="false">Show answer</button>
          <button type="button" id="study-next">Next</button>
          <button type="button" id="study-exit">Exit study</button>
        </div>
        <p class="study-status">Shortcuts: Left/Right arrows to navigate, Space to flip, Escape to exit.</p>
      </section>
    </main>

    <footer>
      <p>&copy; Flashcards</p>
    </footer>

    <dialog id="deck-modal" tabindex="-1" aria-labelledby="deck-modal-title">
      <form id="deck-form">
        <h2 id="deck-modal-title">Add a deck</h2>
        <label for="deck-name">Deck name</label>
        <input id="deck-name" name="deck-name" type="text" required maxlength="80">
        <div class="dialog-actions">
          <button type="button" data-modal-close>Cancel</button>
          <button type="submit" id="save-deck">Save deck</button>
        </div>
      </form>
    </dialog>

    <dialog id="card-modal" tabindex="-1" aria-labelledby="card-modal-title">
      <form id="card-form">
        <h2 id="card-modal-title">Add a card</h2>
        <label for="card-front">Question</label>
        <input id="card-front" name="front" type="text" required maxlength="500">
        <label for="card-back">Answer</label>
        <input id="card-back" name="back" type="text" required maxlength="500">
        <div class="dialog-actions">
          <button type="button" data-modal-close>Cancel</button>
          <button type="submit" id="save-card">Save card</button>
        </div>
      </form>
    </dialog>

    <script src="storage.js"></script>
    <script>
      function createModal(dialog, fallbackFocus) {
        let opener = null;

        function getFocusableElements() {
          return Array.from(
            dialog.querySelectorAll(
              'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
            )
          ).filter((element) => element.getClientRects().length > 0);
        }

        function open(trigger) {
          opener = trigger;
          dialog.showModal();
          const focusableElements = getFocusableElements();
          (focusableElements[0] || dialog).focus();
        }

        function close() {
          if (dialog.open) {
            dialog.close();
          }
        }

        function findReplacementOpener() {
          if (opener?.dataset.action === "edit-deck") {
            return document.querySelector(
              `[data-action="edit-deck"][data-deck-id="${opener.dataset.deckId}"]`
            );
          }
          if (opener?.dataset.action === "edit-card") {
            return document.querySelector(
              `[data-action="edit-card"][data-card-id="${opener.dataset.cardId}"]`
            );
          }
          return null;
        }

        dialog.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            event.preventDefault();
            close();
            return;
          }

          if (event.key !== "Tab") {
            return;
          }

          const focusableElements = getFocusableElements();
          if (focusableElements.length === 0) {
            event.preventDefault();
            dialog.focus();
            return;
          }

          const first = focusableElements[0];
          const last = focusableElements[focusableElements.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        });

        dialog.addEventListener("cancel", (event) => {
          event.preventDefault();
          close();
        });

        dialog.addEventListener("close", () => {
          (opener?.isConnected ? opener : findReplacementOpener() || fallbackFocus).focus();
          opener = null;
        });

        dialog.querySelectorAll("[data-modal-close]").forEach((button) => {
          button.addEventListener("click", close);
        });

        return { open, close };
      }

      const storageStatus = document.querySelector("#storage-status");
      let storageLoadFailed = false;
      let savedState;
      try {
        savedState = FlashcardStorage.loadState();
      } catch (error) {
        storageLoadFailed = true;
        savedState = FlashcardStorage.createDefaultState();
        storageStatus.textContent = `${
          error instanceof Error ? error.message : "Saved data could not be loaded."
        } The example deck is open; changes may not be saved.`;
        storageStatus.hidden = false;
      }
      const decks = savedState.decks;
      let selectedDeckId = savedState.selectedDeckId;
      let nextDeckId = Math.max(0, ...decks.map((deck) => deck.id)) + 1;
      let nextCardId =
        Math.max(0, ...decks.flatMap((deck) => deck.cards.map((card) => card.id))) + 1;
      let editingDeckId = null;
      let editingCardId = null;
      let studySession = null;

      const deckList = document.querySelector("#deck-list");
      const cardList = document.querySelector("#card-list");
      const deckTitle = document.querySelector("#selected-deck-title");
      const searchControls = document.querySelector("#search-controls");
      const searchInput = document.querySelector("#card-search");
      const clearSearchButton = document.querySelector("#clear-search");
      const matchCount = document.querySelector("#match-count");
      const addCardButton = document.querySelector("#open-card-modal");
      const startStudyButton = document.querySelector("#start-study");
      const studyPanel = document.querySelector("#study-mode");
      const studyCardElement = document.querySelector("#study-card");
      const studyFront = document.querySelector("#study-front");
      const studyBack = document.querySelector("#study-back");
      const studyStatus = document.querySelector("#study-status");
      const studyFlipButton = document.querySelector("#study-flip");
      const deckNameInput = document.querySelector("#deck-name");
      const cardFrontInput = document.querySelector("#card-front");
      const cardBackInput = document.querySelector("#card-back");
      let searchQuery = "";
      let searchTimer = null;
      const deckModal = createModal(
        document.querySelector("#deck-modal"),
        document.querySelector("#open-deck-modal")
      );
      const cardModal = createModal(
        document.querySelector("#card-modal"),
        document.querySelector("#open-card-modal")
      );

      function makeButton(label, action, className) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.dataset.action = action;
        if (className) {
          button.className = className;
        }
        return button;
      }

      function makeEmptyState(iconName, heading, instruction) {
        const icons = {
          decks: "M4 5h16v14H4z M8 9h8 M8 13h8 M8 17h4",
          cards: "M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5",
          search: "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M16 16l4 4"
        };
        const item = document.createElement("li");
        item.className = "empty-state";

        const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        icon.classList.add("empty-state-icon");
        icon.setAttribute("viewBox", "0 0 24 24");
        icon.setAttribute("fill", "none");
        icon.setAttribute("stroke", "currentColor");
        icon.setAttribute("stroke-width", "1.75");
        icon.setAttribute("stroke-linecap", "round");
        icon.setAttribute("stroke-linejoin", "round");
        icon.setAttribute("aria-hidden", "true");
        icon.setAttribute("focusable", "false");
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", icons[iconName]);
        icon.append(path);

        const title = document.createElement("h3");
        title.textContent = heading;
        const details = document.createElement("p");
        details.textContent = instruction;
        item.append(icon, title, details);
        return item;
      }

      function renderDecks() {
        deckList.replaceChildren();

        if (decks.length === 0) {
          deckList.append(
            makeEmptyState("decks", "No decks yet", "Choose Add a deck to create your first deck.")
          );
          return;
        }

        decks.forEach((deck) => {
          const item = document.createElement("li");
          item.className = "deck-row";
          const selectButton = makeButton(deck.name, "select-deck", "deck-select");
          selectButton.dataset.deckId = deck.id;
          selectButton.setAttribute("aria-pressed", String(deck.id === selectedDeckId));

          const editButton = makeButton("Edit", "edit-deck");
          editButton.dataset.deckId = deck.id;
          editButton.setAttribute("aria-label", `Edit ${deck.name}`);
          const deleteButton = makeButton("Delete", "delete-deck");
          deleteButton.dataset.deckId = deck.id;
          deleteButton.setAttribute("aria-label", `Delete ${deck.name}`);
          item.append(selectButton, editButton, deleteButton);
          deckList.append(item);
        });
      }

      function renderCards() {
        try {
          FlashcardStorage.saveState({ decks, selectedDeckId });
          if (storageLoadFailed) {
            storageStatus.textContent =
              "Saved data could not be loaded. The example deck is open and this fresh state was saved.";
          } else {
            storageStatus.hidden = true;
          }
        } catch (error) {
          storageStatus.textContent =
            error instanceof Error
              ? error.message
              : "Could not save flashcards to browser storage.";
          storageStatus.hidden = false;
        }
        cardList.replaceChildren();
        const deck = decks.find((item) => item.id === selectedDeckId);
        deckTitle.textContent = deck ? `${deck.name} — Cards` : "Cards";
        addCardButton.disabled = !deck;
        startStudyButton.disabled = !deck || deck.cards.length === 0;
        cardList.hidden = Boolean(studySession);
        addCardButton.hidden = Boolean(studySession);
        searchControls.hidden = Boolean(studySession);
        matchCount.hidden = Boolean(studySession);
        searchInput.disabled = !deck;
        clearSearchButton.disabled = !deck || !searchInput.value;
        studyPanel.hidden = !studySession;

        if (!deck) {
          matchCount.textContent = "0 matches";
          cardList.append(
            makeEmptyState("cards", "Select or create a deck", "Choose Add a deck to get started.")
          );
          return;
        }

        const normalizedQuery = searchQuery.toLocaleLowerCase();
        const matchingCards = deck.cards.filter((card) =>
          `${card.front}\n${card.back}`.toLocaleLowerCase().includes(normalizedQuery)
        );
        matchCount.textContent = `${matchingCards.length} ${
          matchingCards.length === 1 ? "match" : "matches"
        }`;

        if (deck.cards.length === 0) {
          cardList.append(
            makeEmptyState("cards", "No cards in this deck", "Choose Add a card above to create your first flashcard.")
          );
          return;
        }

        if (matchingCards.length === 0) {
          cardList.append(
            makeEmptyState("search", "No matching cards", "Try another search term or clear your search.")
          );
          return;
        }

        matchingCards.forEach((card) => {
          const item = document.createElement("li");
          item.className = "card-item";

          const cardElement = document.createElement("article");
          cardElement.className = "card";
          cardElement.setAttribute("aria-label", `Flashcard: ${card.front}`);
          const front = document.createElement("div");
          front.className = "card-face card-front";
          front.textContent = card.front;
          const back = document.createElement("div");
          back.className = "card-face card-back";
          back.setAttribute("aria-hidden", "true");
          back.textContent = card.back;
          cardElement.append(front, back);

          const actions = document.createElement("div");
          actions.className = "card-actions";
          const flipButton = makeButton("Show answer", "flip-card");
          flipButton.setAttribute("aria-label", `Show answer for ${card.front}`);
          flipButton.setAttribute("aria-pressed", "false");
          const editButton = makeButton("Edit", "edit-card");
          editButton.dataset.cardId = card.id;
          editButton.setAttribute("aria-label", `Edit card: ${card.front}`);
          const deleteButton = makeButton("Delete", "delete-card");
          deleteButton.dataset.cardId = card.id;
          deleteButton.setAttribute("aria-label", `Delete card: ${card.front}`);
          actions.append(flipButton, editButton, deleteButton);
          item.append(cardElement, actions);
          cardList.append(item);
        });

        if (studySession) {
          renderStudyCard();
        }
      }

      function renderStudyCard() {
        if (!studySession) {
          return;
        }

        const deck = decks.find((item) => item.id === studySession.deckId);
        if (!deck || deck.cards.length === 0) {
          exitStudyMode();
          return;
        }

        studySession.index = Math.min(studySession.index, deck.cards.length - 1);
        const card = deck.cards[studySession.index];
        studyFront.textContent = card.front;
        studyBack.textContent = card.back;
        studyCardElement.classList.toggle("is-flipped", studySession.isFlipped);
        studyFront.setAttribute("aria-hidden", String(studySession.isFlipped));
        studyBack.setAttribute("aria-hidden", String(!studySession.isFlipped));
        studyFlipButton.setAttribute("aria-pressed", String(studySession.isFlipped));
        studyFlipButton.textContent = studySession.isFlipped ? "Show question" : "Show answer";
        studyStatus.textContent = `Card ${studySession.index + 1} of ${deck.cards.length}`;
      }

      function enterStudyMode(deckId) {
        const deck = decks.find((item) => item.id === deckId);
        if (!deck || deck.cards.length === 0) {
          return false;
        }

        if (studySession) {
          exitStudyMode();
        }

        selectedDeckId = deck.id;
        startStudyButton.textContent = "End study";
        studySession = {
          deckId: deck.id,
          index: 0,
          isFlipped: false,
          handleKeydown(event) {
            if (event.target instanceof Element && event.target.closest("dialog[open]")) {
              return;
            }

            if (event.key === "Escape") {
              event.preventDefault();
              exitStudyMode();
              return;
            }

            const target = event.target;
            const isEditingText =
              target instanceof HTMLElement &&
              (target.isContentEditable || target.matches("input, textarea, select"));
            if (isEditingText || event.altKey || event.ctrlKey || event.metaKey) {
              return;
            }

            if (event.key === "ArrowLeft") {
              event.preventDefault();
              moveStudyCard(-1);
            } else if (event.key === "ArrowRight") {
              event.preventDefault();
              moveStudyCard(1);
            } else if (
              event.key === " " &&
              !(target instanceof HTMLButtonElement)
            ) {
              event.preventDefault();
              flipStudyCard();
            }
          }
        };
        window.addEventListener("keydown", studySession.handleKeydown);
        renderCards();
        studyCardElement.focus();
        return true;
      }

      function exitStudyMode() {
        if (!studySession) {
          return;
        }

        window.removeEventListener("keydown", studySession.handleKeydown);
        studySession.isFlipped = false;
        studyCardElement.classList.remove("is-flipped");
        studyFront.setAttribute("aria-hidden", "false");
        studyBack.setAttribute("aria-hidden", "true");
        studyFlipButton.setAttribute("aria-pressed", "false");
        studyFlipButton.textContent = "Show answer";
        studySession = null;
        startStudyButton.textContent = "Study deck";
        renderCards();
        startStudyButton.focus();
      }

      function moveStudyCard(offset) {
        if (!studySession) {
          return;
        }
        const deck = decks.find((item) => item.id === studySession.deckId);
        if (!deck || deck.cards.length === 0) {
          exitStudyMode();
          return;
        }

        studySession.index = (studySession.index + offset + deck.cards.length) % deck.cards.length;
        studySession.isFlipped = false;
        renderStudyCard();
      }

      function flipStudyCard() {
        if (!studySession) {
          return;
        }
        studySession.isFlipped = !studySession.isFlipped;
        renderStudyCard();
      }

      function render() {
        renderDecks();
        renderCards();
      }

      document.querySelector("#open-deck-modal").addEventListener("click", (event) => {
        editingDeckId = null;
        document.querySelector("#deck-modal-title").textContent = "Add a deck";
        document.querySelector("#save-deck").textContent = "Save deck";
        deckNameInput.value = "";
        deckModal.open(event.currentTarget);
      });

      document.querySelector("#open-card-modal").addEventListener("click", (event) => {
        editingCardId = null;
        document.querySelector("#card-modal-title").textContent = "Add a card";
        document.querySelector("#save-card").textContent = "Save card";
        cardFrontInput.value = "";
        cardBackInput.value = "";
        cardModal.open(event.currentTarget);
      });

      searchInput.addEventListener("input", () => {
        window.clearTimeout(searchTimer);
        clearSearchButton.disabled = !searchInput.value;
        searchTimer = window.setTimeout(() => {
          searchQuery = searchInput.value.trim();
          renderCards();
        }, 300);
      });

      clearSearchButton.addEventListener("click", () => {
        window.clearTimeout(searchTimer);
        searchInput.value = "";
        searchQuery = "";
        clearSearchButton.disabled = true;
        renderCards();
        searchInput.focus();
      });

      document.querySelector("#deck-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = deckNameInput.value.trim();
        if (!name) {
          deckNameInput.setCustomValidity("Enter a deck name.");
          deckNameInput.reportValidity();
          deckNameInput.focus();
          return;
        }

        if (editingDeckId === null) {
          const deck = { id: nextDeckId++, name, cards: [] };
          decks.push(deck);
          selectedDeckId = deck.id;
        } else {
          const deck = decks.find((item) => item.id === editingDeckId);
          if (!deck) {
            throw new Error("Cannot update a deck that no longer exists.");
          }
          deck.name = name;
        }

        render();
        deckModal.close();
      });

      deckNameInput.addEventListener("input", () => deckNameInput.setCustomValidity(""));

      document.querySelector("#card-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const frontText = cardFrontInput.value.trim();
        const backText = cardBackInput.value.trim();
        const deck = decks.find((item) => item.id === selectedDeckId);
        if (!deck) {
          throw new Error("Cannot save a card because no deck is selected.");
        }
        if (!frontText || !backText) {
          const invalidInput = frontText ? cardBackInput : cardFrontInput;
          invalidInput.setCustomValidity("This field cannot be blank.");
          invalidInput.reportValidity();
          invalidInput.focus();
          return;
        }

        if (editingCardId === null) {
          deck.cards.push({ id: nextCardId++, front: frontText, back: backText });
        } else {
          const card = deck.cards.find((item) => item.id === editingCardId);
          if (!card) {
            throw new Error("Cannot update a card that no longer exists.");
          }
          card.front = frontText;
          card.back = backText;
        }

        render();
        cardModal.close();
      });

      cardFrontInput.addEventListener("input", () => cardFrontInput.setCustomValidity(""));
      cardBackInput.addEventListener("input", () => cardBackInput.setCustomValidity(""));

      deckList.addEventListener("click", (event) => {
        const target = event.target;
        const button =
          target instanceof Element ? target.closest("button[data-action]") : null;
        if (!(button instanceof HTMLButtonElement)) {
          return;
        }

        const deckId = Number(button.dataset.deckId);
        const deck = decks.find((item) => item.id === deckId);
        if (!deck) {
          return;
        }

        if (button.dataset.action === "select-deck") {
          if (studySession) {
            exitStudyMode();
          }
          selectedDeckId = deck.id;
          render();
          const selectedDeckButton = deckList.querySelector(
            `[data-action="select-deck"][data-deck-id="${deck.id}"]`
          );
          (selectedDeckButton || deckTitle).focus();
        } else if (button.dataset.action === "edit-deck") {
          editingDeckId = deck.id;
          document.querySelector("#deck-modal-title").textContent = "Edit deck";
          document.querySelector("#save-deck").textContent = "Save changes";
          deckNameInput.value = deck.name;
          deckModal.open(button);
        } else if (button.dataset.action === "delete-deck") {
          const index = decks.findIndex((item) => item.id === deck.id);
          decks.splice(index, 1);
          if (selectedDeckId === deck.id) {
            selectedDeckId = decks[0]?.id ?? null;
          }
          if (studySession?.deckId === deck.id) {
            exitStudyMode();
          }
          render();
          const replacementDeckButton =
            deckList.querySelector(`[data-action="select-deck"][data-deck-id="${selectedDeckId}"]`);
          (replacementDeckButton || document.querySelector("#open-deck-modal")).focus();
        }
      });

      cardList.addEventListener("click", (event) => {
        const target = event.target;
        const button =
          target instanceof Element ? target.closest("button[data-action]") : null;
        if (!(button instanceof HTMLButtonElement)) {
          return;
        }

        const item = button.closest(".card-item");
        if (!item) {
          return;
        }
        const cardElement = item.querySelector(".card");
        const deck = decks.find((candidate) => candidate.id === selectedDeckId);
        const cardId = Number(button.dataset.cardId);
        const card = deck?.cards.find((candidate) => candidate.id === cardId);
        if (button.dataset.action === "flip-card") {
          if (!card || !cardElement) {
            return;
          }
          const flipped = cardElement.classList.toggle("is-flipped");
          button.setAttribute("aria-pressed", String(flipped));
          button.textContent = flipped ? "Show question" : "Show answer";
          button.setAttribute(
            "aria-label",
            `${flipped ? "Show question" : "Show answer"} for ${card.front}`
          );
          const front = item.querySelector(".card-front");
          const back = item.querySelector(".card-back");
          if (front && back) {
            front.setAttribute("aria-hidden", String(flipped));
            back.setAttribute("aria-hidden", String(!flipped));
          }
        } else if (button.dataset.action === "edit-card" && card) {
          editingCardId = card.id;
          document.querySelector("#card-modal-title").textContent = "Edit card";
          document.querySelector("#save-card").textContent = "Save changes";
          cardFrontInput.value = card.front;
          cardBackInput.value = card.back;
          cardModal.open(button);
        } else if (button.dataset.action === "delete-card" && card && deck) {
          const deletedCardIndex = deck.cards.findIndex((candidate) => candidate.id === card.id);
          deck.cards = deck.cards.filter((candidate) => candidate.id !== card.id);
          render();
          const nextCard = deck.cards[Math.min(deletedCardIndex, deck.cards.length - 1)];
          const nextDeleteButton = nextCard
            ? cardList.querySelector(`[data-action="delete-card"][data-card-id="${nextCard.id}"]`)
            : null;
          (nextDeleteButton || deckTitle).focus();
        }
      });

      startStudyButton.addEventListener("click", () => {
        if (studySession) {
          exitStudyMode();
        } else {
          enterStudyMode(selectedDeckId);
        }
      });

      document.querySelector("#study-previous").addEventListener("click", () => {
        moveStudyCard(-1);
      });
      document.querySelector("#study-next").addEventListener("click", () => {
        moveStudyCard(1);
      });
      studyFlipButton.addEventListener("click", flipStudyCard);
      document.querySelector("#study-exit").addEventListener("click", exitStudyMode);

      render();
    </script>
  </body>
</html>
